<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Accent Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Base Card -->
  <rect width="900" height="160" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="160" rx="16" fill="url(#glow)" />

  <!-- Subtle Border -->
  <rect x="0.5" y="0.5" width="899" height="159" rx="15.5" stroke="#334155" stroke-opacity="0.5" />

  <!-- Decorative Window Controls -->
  <circle cx="36" cy="28" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="52" cy="28" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="68" cy="28" r="5" fill="#10B981" opacity="0.8" />

  <!-- Grid Pattern (subtle tech vibe) -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="160" />
    <line x1="300" y1="0" x2="300" y2="160" />
    <line x1="450" y1="0" x2="450" y2="160" />
    <line x1="600" y1="0" x2="600" y2="160" />
    <line x1="750" y1="0" x2="750" y2="160" />
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
  </g>

  <!-- Main Content -->
  <g transform="translate(48, 44)">
    <!-- Main Title -->
    <text x="0" y="38" class="title">Víctor Auñón</text>

    <!-- Subtitle -->
    <text x="0" y="70" class="subtitle">Senior FullStack Developer ✷ PhD Mechanical Engineering</text>
  </g>

  <!-- Bottom Accent Wave -->
  <path d="M0 148 C 250 142, 450 156, 900 148 L 900 160 L 0 160 Z" fill="url(#waveGrad)" />
</svg>
